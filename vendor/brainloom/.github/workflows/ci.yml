name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # pinned: the background-service-free default shell on every runner image
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: syntax check
        run: node --check scripts/check-update.mjs && node --check scripts/validate-brain.mjs && node --check scripts/migrate.mjs && node --check scripts/smoke.mjs
      - name: smoke (structural)
        run: node scripts/smoke.mjs
      - name: smoke (agent plumbing, offline)
        run: node scripts/smoke.mjs --agent --skill triage --agent-cmd "node tests/fake-agent.mjs"
      - name: validate sample brain
        run: node scripts/validate-brain.mjs tests/fixtures/sample-project/brain
      - name: installer exposes kit scripts
        run: |
          node adapters/opencode/install.mjs --config-dir "$RUNNER_TEMP/bl"
          node "$RUNNER_TEMP/bl/brainloom/validate-brain.mjs" tests/fixtures/sample-project/brain
          node "$RUNNER_TEMP/bl/brainloom/migrate.mjs" tests/fixtures/sample-project/brain --migrations-dir tests/fixtures/migrations
      - name: migration dry-run
        run: node scripts/migrate.mjs tests/fixtures/sample-project/brain --migrations-dir tests/fixtures/migrations
      - name: update check is offline-tolerant
        run: node scripts/check-update.mjs --kit .
